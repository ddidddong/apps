<!DOCTYPE html>
<html lang="ko">

<head>
    <!-- Google Tag Manager -->
    <script>(function (w, d, s, l, i) {
            w[l] = w[l] || []; w[l].push({
                'gtm.start':
                    new Date().getTime(), event: 'gtm.js'
            }); var f = d.getElementsByTagName(s)[0],
                j = d.createElement(s), dl = l != 'dataLayer' ? '&l=' + l : ''; j.async = true; j.src =
                    'https://www.googletagmanager.com/gtm.js?id=' + i + dl; f.parentNode.insertBefore(j, f);
        })(window, document, 'script', 'dataLayer', 'GTM-KLN34C9H');</script>
    <!-- End Google Tag Manager -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한자카드 관리자 대시보드</title>
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="admin.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-KLN34C9H" height="0" width="0"
            style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <div id="login-screen" class="screen active">
        <div class="login-card">
            <h1>🛡️ 관리자 로그인</h1>
            <p>비밀번호를 입력하여 접속하세요.</p>
            <div class="input-group">
                <input type="password" id="admin-password" placeholder="비밀번호" autocomplete="off">
            </div>
            <p id="login-error" class="error-msg hidden">비밀번호가 일치하지 않습니다.</p>
            <button id="login-btn" class="primary-btn">로그인</button>
        </div>
    </div>

    <div id="dashboard-screen" class="screen hidden">
        <header class="admin-header">
            <div class="header-content">
                <h1>한자카드 대시보드</h1>
                <div style="display: flex; gap: 1rem; align-items: center;">
                    <button id="theme-toggle" class="theme-toggle-btn" title="다크모드 전환">🌙</button>
                    <button id="logout-btn" class="secondary-btn">로그아웃</button>
                </div>
            </div>
        </header>

        <main class="dashboard-content">
            <section class="widget-section" style="margin-top: 2rem;">
                <h2>📊 사이트 통계 및 접속자</h2>
                <p>총 누적 방문자 수입니다. 상세 통계는 구글 애널리틱스에서 확인하세요.</p>

                <div class="stats-cards">
                    <div class="stat-card" style="border-left: 4px solid var(--primary);">
                        <div class="stat-icon">👥</div>
                        <div class="stat-info">
                            <h3>오늘 방문자 (UV)</h3>
                            <p style="font-size: 2rem; font-family: var(--font-title); color: var(--text); font-weight: bold; margin: 0.5rem 0;"
                                id="stat-today-uv">
                                <span class="loading-spinner">...</span>
                            </p>
                        </div>
                    </div>

                    <div class="stat-card">
                        <div class="stat-icon">📅</div>
                        <div class="stat-info">
                            <h3>주간 / 월간 방문자</h3>
                            <p style="font-size: 1.5rem; font-family: var(--font-title); color: var(--text); font-weight: bold; margin: 0.5rem 0;"
                                id="stat-period-uv">
                                <span class="loading-spinner">...</span>
                            </p>
                        </div>
                    </div>

                    <div class="stat-card">
                        <div class="stat-icon">🔄</div>
                        <div class="stat-info">
                            <h3>신규 vs 재방문 비율</h3>
                            <p style="font-size: 1.2rem; font-family: var(--font-title); color: var(--text); font-weight: bold; margin: 0.5rem 0;"
                                id="stat-return">
                                <span class="loading-spinner">...</span>
                            </p>
                        </div>
                    </div>

                    <div class="stat-card">
                        <div class="stat-icon">⏱️</div>
                        <div class="stat-info">
                            <h3>평균 체류 시간</h3>
                            <p style="font-size: 1.5rem; font-family: var(--font-title); color: var(--text); font-weight: bold; margin: 0.5rem 0;"
                                id="stat-duration">
                                <span class="loading-spinner">...</span>
                            </p>
                        </div>
                    </div>
                </div>

                <div class="stats-rows" style="display: flex; gap: 1.5rem; margin-top: 1.5rem; flex-wrap: wrap;">
                    <div class="stat-list-card"
                        style="flex: 1; min-width: 300px; background: white; padding: 1.5rem; border-radius: 16px; border: 1px solid var(--border);">
                        <h3 style="margin-bottom: 1rem; border-bottom: 2px solid #f1f2f6; padding-bottom: 0.5rem;">🔥 인기
                            메뉴 (Top 3)</h3>
                        <ul id="list-top-menus" style="list-style: none; padding: 0; line-height: 2;">
                            <li>데이터를 불러오는 중...</li>
                        </ul>
                    </div>

                    <div class="stat-list-card"
                        style="flex: 1; min-width: 300px; background: white; padding: 1.5rem; border-radius: 16px; border: 1px solid var(--border);">
                        <h3 style="margin-bottom: 1rem; border-bottom: 2px solid #f1f2f6; padding-bottom: 0.5rem;">🀄 가장
                            많이 본 한자 (Top 5)</h3>
                        <ul id="list-top-hanja" style="list-style: none; padding: 0; line-height: 2;">
                            <li>데이터를 불러오는 중...</li>
                        </ul>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="admin.js"></script>
</body>

</html>
